<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Request Service - CompuStore HMS</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div class="app-shell">
  <nav class="sidebar">
    <div class="sidebar-logo">CompuStore</div>
    <div class="sidebar-section">My Account</div>
    <a class="sidebar-link" href="dashboard.html"><span class="icon">HM</span> Home</a>
    <a class="sidebar-link" href="shop.html"><span class="icon">SH</span> Shop</a>
    <a class="sidebar-link" href="my-orders.html"><span class="icon">OR</span> My Orders</a>
    <a class="sidebar-link" href="my-services.html"><span class="icon">SV</span> My Services</a>
    <a class="sidebar-link active" href="request-service.html"><span class="icon">RQ</span> Request Service</a>
    <div class="sidebar-section">Account</div>
    <a class="sidebar-link logout-btn" href="#"><span class="icon">LO</span> Logout</a>
  </nav>
  <main class="main-area">
    <div class="topbar"><span class="topbar-title">Request Service</span><div class="topbar-user"><span id="topbarName">Customer</span><div class="avatar" id="topbarAvatar">CU</div></div></div>
    <div class="page-content">
      <div id="alertBox" class="alert hidden"></div>
      <div class="card">
        <div class="card-header"><h3>Device Details</h3></div>
        <form id="serviceForm">
          <div class="form-row">
            <div class="form-group"><label>Device Type</label><input name="device_type" required placeholder="Laptop, desktop, printer"></div>
            <div class="form-group"><label>Brand</label><input name="device_brand" placeholder="Dell, HP, Lenovo"></div>
          </div>
          <div class="form-row">
            <div class="form-group"><label>Priority</label><select name="priority"><option value="low">Low</option><option value="medium" selected>Medium</option><option value="high">High</option></select></div>
            <div class="form-group"><label>Estimated Cost</label><input name="estimated_cost" type="number" min="0" step="0.01"></div>
          </div>
          <div class="form-group"><label>Issue Description</label><textarea name="issue_description" required></textarea></div>
          <button class="btn btn-primary" type="submit">Submit Request</button>
        </form>
      </div>
    </div>
  </main>
</div>
<script src="../js/utils.js"></script>
<script src="../js/request-service.js"></script>
</body>
</html>
